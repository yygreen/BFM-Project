<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Five accounts pooling into one for free, beside a paid bridge between two accounts">
  <rect width="1200" height="480" fill="#F5F6FF"/>
  <rect x="70" y="96" width="1060" height="288" rx="56" fill="#E7EAFF" opacity="0.52"/>


  <!-- five accounts into one shared pool, nothing in the way -->
  <g stroke="#2540FF" stroke-width="2.5" fill="none">
    <path d="M320 146 L400 240"/>
    <path d="M320 193 L400 240"/>
    <path d="M320 240 H400"/>
    <path d="M320 287 L400 240"/>
    <path d="M320 334 L400 240"/>
    <path d="M400 240 H436" stroke-width="5"/>
  </g>
  <circle cx="400" cy="240" r="9" fill="#2540FF"/>
  <g fill="#FFFFFF" stroke="#2540FF" stroke-width="2.5">
    <rect x="256" y="128" width="64" height="36" rx="10"/>
    <rect x="256" y="175" width="64" height="36" rx="10"/>
    <rect x="256" y="222" width="64" height="36" rx="10"/>
    <rect x="256" y="269" width="64" height="36" rx="10"/>
    <rect x="256" y="316" width="64" height="36" rx="10"/>
  </g>
  <rect x="436" y="168" width="144" height="144" rx="36" fill="#2540FF" stroke="#10122B" stroke-width="2.5"/>
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="488" cy="222" r="15"/>
    <circle cx="528" cy="222" r="15"/>
    <circle cx="488" cy="262" r="15"/>
    <circle cx="528" cy="262" r="15"/>
  </g>

  <line x1="672" y1="120" x2="672" y2="360" stroke="#10122B" stroke-width="2" stroke-dasharray="8 10" opacity="0.22"/>

  <!-- and the paid route: two accounts, one toll -->
  <g fill="#FFFFFF" stroke="#2540FF" stroke-width="2.5">
    <rect x="760" y="184" width="112" height="112" rx="24"/>
    <rect x="1000" y="184" width="112" height="112" rx="24"/>
  </g>
  <line x1="872" y1="240" x2="1000" y2="240" stroke="#10122B" stroke-width="2.5"/>
  <rect x="912" y="208" width="48" height="64" rx="14" fill="#FF5C3A" stroke="#10122B" stroke-width="2.5"/>
</svg>
